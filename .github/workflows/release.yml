name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Linux Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Standalone Linux Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          LDFLAGS="-s -w -trimpath -X github.com/SepJs/anubis/pkg/version.Version=${VERSION} -X github.com/SepJs/anubis/pkg/version.GitHash=${GITHUB_SHA::7}"

          # Linux x86_64 (amd64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/anubis_${VERSION}_linux_amd64 ./cmd/anubis
          
          # Linux aarch64 (arm64)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/anubis_${VERSION}_linux_arm64 ./cmd/anubis

          # Generate Checksums
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
